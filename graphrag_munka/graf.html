]"}, {"id": "PÉNZÜGYI ELLENJEGYZÉS", "label": "PÉNZÜGYI ELLENJEGYZÉS", "type": "FOLYAMAT", "desc": "A **PÉNZÜGYI ELLENJEGYZÉS** a kötelezettségvállalásokhoz kapcsolódó pénzügyi ellenőrzési, jóváhagyási és ellenjegyzési eljárás, amelynek célja annak igazolása, hogy a vállalás pénzügyileg, számviteli és adózási szempontból megfelelő, valamint hogy a szükséges pénzügyi fedezet rendelkezésre áll. A PÉNZÜGYI ELLENJEGYZÉS a kötelezettségvállalási rend része, és általában minden olyan pénzügyi kihatással járó bevételi vagy kiadási kötelezettségvállalásnál szükséges, kivéve, ha jogszabály, belső szabályzat vagy egyéb utasítás kifejezetten eltérően rendelkezik. Egyes hallgatói kötelezettségvállalási okiratok esetén nem szükséges, más esetekben viszont alkalmazandó.\n\nAz eljárás a kötelezettségvállalás véglegesítését megelőző pénzügyi kontrollt jelenti, és a kötelezettségvállalás módosítására is ugyanazon szabályokat kell alkalmazni. A PÉNZÜGYI ELLENJEGYZÉS rögzítése a kötelezettségvállalási okiraton történik, és a jogkeletkezés, a módosulás, illetve a megszűnés bejelentésköteles lehet.\n\nA PÉNZÜGYI ELLENJEGYZÉS gyakorlását meghatározott jogosult személyek, jellemzően pénzügyi munkatársak végezhetik. Az eljárásra helyettesítési, összeférhetetlenségi és jogosultság-megszűnési szabályok vonatkoznak, továbbá kapcsolódik hozzá a jogosultak körének nyilvántartása, a bejelentés, valamint az aláírás-minták kezelése is. Elektronikus okirat esetén a PÉNZÜGYI ELLENJEGYZÉS fokozott biztonságú elektronikus aláírással is teljesíthető.", "value": 24, "color": "#3949AB", "title": "PÉNZÜGYI ELLENJEGYZÉS [FOLYAMAT]"}, {"id": "ÉRVÉNYESÍTÉS", "label": "ÉRVÉNYESÍTÉS", "type": "FOLYAMAT", "desc": "Az **ÉRVÉNYESÍTÉS** egy pénzügyi és adminisztratív ellenőrzési folyamat, amely a gazdasági események, kötelezettségvállalások és azokhoz kapcsolódó dokumentumok érvényességének igazolására szolgál. Az ÉRVÉNYESÍTÉS során az érvényesítő a pénzügyi teljesítést megelőzően, a **négy szem elvét** követve, a ő, előzetes döntéshozó, valamint bizonyos esetekben döntéshozó vagy képviseleti szerepben.\n\nA **GAZDASÁGI IGAZGATÓ** a beszerzési folyamatokban általában előzetes döntéshozóként vesz részt, illetve kapcsolódó vezetői szerepet tölt be. Kiemelten érintett a 100 millió forint alatti IT-beszerzések, a banki, pénzügyi és hitel szolgáltatásokhoz kapcsolódó beszerzések, valamint a tanácsadói szolgáltatások beszerzése során, ahol előkészítő, véleményező vagy döntési feladatokat láthat el. Egyes beszerzési és kötelezettségvállalási ügyekben javaslattevőként vagy előzetes véleményezőként is szerepelhet.\n\nA **GAZDASÁGI IGAZGATÓ** továbbá a pénzügyi kötelezettségvállalások körében is szerepet kap, ahol előkészítő, döntéshozói vagy képviseleti feladatokat láthat el. A tisztség bizonyos esetekben előzetes döntéshozóként vagy döntéshozóként jár el, különösen a szervezet gazdasági ügyeit érintő kötelezettségvállalásoknál. Emellett a terven felüli létszám vagy a személyi jellegű költségek jóváhagyásában is előzetes döntéshozó szerepe van.\n\nA leírások alapján a **GAZDASÁGI IGAZGATÓ** egy olyan vezető, aki a gazdasági és pénzügyi működéshez kapcsolódó döntésekben központi szerepet tölt be, és adott ügytípustól függően előkészítő, ellenőrző, véleményező vagy döntési jogosultsággal rendelkezik. Pénzügyi ellenjegyzés esetén helyettesítő szerepet is betölthet, ha a gazdasági és műszaki főigazgató összeférhetetlenség miatt nem járhat el.", "value": 15, "color": "#E53935", "title": "GAZDASÁGI IGAZGATÓ [TISZTSÉG]"}, {"id": "IRATKEZELÉS RENDJÉRŐL SZÓLÓ REKTORI UTASÍTÁS", "label": "IRATKEZELÉS RENDJÉRŐL SZÓLÓ REKTORI UTASÍTÁS", "type": "OKIRAT", "desc": "Olyan rektori utasítás, amely a hitelesítés általános rendjét határozza meg, és amelynek keretei között jelen utasítás meghatározhatja a hitelesítés szabályait.", "value": 2, "color": "#3949AB", "title": "IRATKEZELÉS RENDJÉRŐL SZÓLÓ REKTORI UTASÍTÁS [OKIRAT]"}, {"id": "TÁMOGATÁSI SZERZŐDÉS/TÁMOGATÓI OKIRAT", "label": "TÁMOGATÁSI SZERZŐDÉ const nodes = new vis.DataSet(D.nodes), edges = new vis.DataSet(D.edges);
const net = new vis.Network(document.getElementById("net"), {nodes, edges}, {
  nodes:{shape:"dot", scaling:{min:4, max:40, label:{enabled:true, min:9, max:30, drawThreshold:8}}},
  edges:{color:{color:"#cfd8dc", highlight:"#0053A3"}, smooth:false, scaling:{min:0.5, max:6}},
  physics:{solver:"forceAtlas2Based", forceAtlas2Based:{gravitationalConstant:-60, springLength:90},
           stabilization:{iterations:400}}, interaction:{hover:true, tooltipDelay:150}});
net.once("stabilizationIterationsDone", () => net.setOptions({physics:false}));
const info = document.getElementById("info");
net.on("click", p => {
  if (p.nodes.length) { const n = nodes.get(p.nodes[0]); info.textContent = n.label + "  [" + n.type + "]\n\n" + n.desc; }
  else if (p.edges.length) { const e = edges.get(p.edges[0]); info.textContent = e.from + " → " + e.to + "\n\n" + e.desc; }
});
document.getElementById("q").addEventListener("input", ev => {
  const t = ev.target.value.toLowerCase(); if (!t) return;
  const hit = D.nodes.filter(n => n.label.toLowerCase().includes(t)).map(n => n.id);
  net.selectNodes(hit); if (hit.length) net.focus(hit[0], {scale:1.2, animation:true});
});
const reps = document.getElementById("reps");
for (const r of D.reports) {
  const d = document.createElement("div"); d.className = "rep";
  d.innerHTML = "<b></b><div class=small></div><div></div>";
  d.children[0].textContent = r.title; d.children[1].textContent = r.level + ". szint · " + r.size + " entitás · fontosság " + r.rating;
  d.children[2].textContent = r.summary.length > 220 ? r.summary.slice(0, 220) + "…" : r.summary;
  d.onclick = () => { net.selectNodes(r.nodes); net.fit({nodes:r.nodes, animation:true});
    info.textContent = r.title + "\n\n" + r.summary + "\n\n" + r.findings.map(f => "• " + f).join("\n"); };
  reps.appendChild(d);
}
